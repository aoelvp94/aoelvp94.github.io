<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aldo Escobar</title>
  <style>
    html, body { margin: 0; background: #4a4a4a; }
    iframe { display: block; width: 100%; height: 100vh; border: 0; }
    #pages { display: none; padding: 8px 0 24px; }
    #pages img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 8px;
      background: #fff;
    }
    #travel-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(102, 126, 234, 0.9);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background 0.2s;
      z-index: 1000;
    }
    #travel-link:hover {
      background: rgba(102, 126, 234, 1);
    }
    .bottom-links {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    .bottom-links a {
      background: rgba(74, 74, 74, 0.9);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    .bottom-links a:hover {
      background: rgba(74, 74, 74, 1);
    }
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      iframe { display: none; }
      #pages { display: block; }
      #travel-link {
        bottom: 10px;
        right: 10px;
        padding: 8px 14px;
        font-size: 13px;
      }
      .bottom-links {
        bottom: 10px;
        left: 10px;
        flex-wrap: wrap;
        max-width: calc(100vw - 140px);
      }
      .bottom-links a {
        padding: 8px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <iframe src="cv.pdf" title="Curriculum vitae of Aldo Escobar"></iframe>
  <div id="pages">
    <!-- pages -->
  </div>
  <div class="bottom-links">
    <a href="argentina/">🇦🇷 Argentina</a>
    <a href="blog/">📝 Blog</a>
  </div>
  <a href="travel/" id="travel-link">🌍 Travel</a>
</body>
</html>
