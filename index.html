<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aldo Escobar</title>
  <style>
    html, body { margin: 0; background: #4a4a4a; }
    iframe { display: block; width: 100%; height: 100vh; border: 0; }
    #pages { display: none; padding: 8px 0 24px; }
    #pages img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 8px;
      background: #fff;
    }
    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      iframe { display: none; }
      #pages { display: block; }
    }
  </style>
</head>
<body>
  <iframe src="cv.pdf" title="Curriculum vitae of Aldo Escobar"></iframe>
  <div id="pages">
    <!-- pages -->
  </div>
</body>
</html>
