<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aldo Escobar, data engineer</title>
  <meta name="description" content="Data engineer and data platform specialist. Digital nomad for more than four years, used to remote teams and flexible across time zones.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background: #f4f1ea;
      color: #1c1c1c;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    header {
      flex: 0 0 auto;
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid #1c1c1c;
      background: #f4f1ea;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .intro {
      margin: 0.45rem 0 0;
      max-width: 40rem;
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.45;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 0.9rem;
    }
    a {
      color: #0b3a75;
      text-underline-offset: 0.15em;
    }
    a:focus-visible {
      outline: 2px solid #0b3a75;
      outline-offset: 2px;
    }
    .cv {
      flex: 1 1 auto;
      min-height: 0;
      background: #4a4a4a;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 70vh;
      border: 0;
    }
    @media (max-width: 640px) {
      header { padding: 1rem; }
      h1 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Aldo Escobar</h1>
    <p class="intro">Data engineer and data platform specialist. Digital nomad for more than four years, used to remote teams and flexible across time zones.</p>
    <nav aria-label="Contact and curriculum vitae">
      <a href="cv.pdf">Download the CV</a>
      <a href="https://www.linkedin.com/in/aldo-escobar-810a0598/">LinkedIn</a>
      <a href="https://github.com/aoelvp94">GitHub</a>
      <a href="https://github.com/apache/airflow/pull/64986">Airflow contribution</a>
      <a href="https://github.com/astronomer/astronomer-cosmos/pull/2481">Cosmos contribution</a>
    </nav>
  </header>
  <main class="cv">
    <iframe src="cv.pdf" title="Curriculum vitae of Aldo Escobar"></iframe>
  </main>
</body>
</html>
