name: Publish CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/tectonic

      - name: Compile the CV
        run: tectonic cv.tex

      - name: Assemble the site
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p site
          pdftoppm -png -r 160 cv.pdf site/page
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          pages = sorted(Path("site").glob("page-*.png"), key=lambda p: int(p.stem.split("-")[-1]))
          if not pages or "<!-- pages -->" not in html:
              raise SystemExit("CV page images were not added to the site")
          imgs = "\n".join(
              f'    <img src="{page.name}" alt="Curriculum vitae, page {number}">'
              for number, page in enumerate(pages, 1)
          )
          Path("site/index.html").write_text(html.replace("<!-- pages -->", imgs))
          PY
          cp cv.pdf site/
          cp -r travel site/
          cp -r argentina site/
          cp -r blog site/
          test -f site/argentina/index.html
          test -f site/argentina/en/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
